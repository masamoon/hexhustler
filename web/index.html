<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexHustler</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #030205;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f0d690;
        font: 18px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">Shuffling the house deck...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
